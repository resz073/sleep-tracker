name: Build Android app

# Runs on every push to main, and from the Actions tab with "Run workflow".
# Each run publishes a release with the APK (to install on a phone) and the AAB (to upload to Google Play).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "store/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  android:
    # Pinned: GitHub is moving ubuntu-latest to Ubuntu 26, and this image already has the Android SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then echo "::error::No Android SDK on this runner."; exit 1; fi
          echo "::notice title=Tools::Node $(node --version), $(java -version 2>&1 | head -1), build tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Install packages
        run: bash scripts/ci-run.sh "Install packages" npm install --no-audit --no-fund

      - name: Add Firebase settings
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci-run.sh "Firebase settings" node scripts/write-config.mjs

      - name: Build the app screens
        run: bash scripts/ci-run.sh "App screens" npm run build

      - name: Create the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          bash scripts/ci-run.sh "cap add android" npx cap add android
          bash scripts/ci-run.sh "Android patches" node scripts/patch-android.mjs
          bash scripts/ci-run.sh "cap sync android" npx cap sync android

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          bash ../scripts/ci-run.sh "Gradle build" ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/ci-run.sh "Signing" bash scripts/sign.sh

      - uses: actions/upload-artifact@v6
        with:
          name: sleep-tracker-build-${{ github.run_number }}
          path: dist/
          retention-days: 30

      # A release per build gives a download link that works on a phone without signing in to GitHub.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION-build.${{ github.run_number }}"
          if [ -f dist/sleep-tracker-test.apk ]; then
            APK=sleep-tracker-test.apk
            NOTES="Test build, signed with the public test key. Install the APK on your phone to try the app. Don't upload it to Google Play."
          else
            APK=sleep-tracker.apk
            NOTES="Signed with your upload key. Install the APK on your phone, or upload the AAB to Google Play."
          fi
          bash scripts/ci-run.sh "Release" gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Sleep Tracker $VERSION (build ${{ github.run_number }})" --notes "$NOTES"
          echo "::notice title=Download::https://github.com/${{ github.repository }}/releases/download/$TAG/$APK"
