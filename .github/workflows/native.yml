name: Build Android app

# The app (native/, Kotlin). Runs on every push that changes it, and from the Actions tab with "Run workflow".
# Each run tests it, publishes a release with the APK (to install on a phone) and the AAB (to upload to
# Google Play), then uses the APK on Android emulators.
on:
  push:
    branches: [main]
    # src/app.js too: the sleep engine is tested against the earlier web app's own results
    paths: ["native/**", ".github/workflows/native.yml", "scripts/sign.sh", "scripts/ci-run.sh", "src/app.js"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-build
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then echo "::error::No Android SDK on this runner."; exit 1; fi
          echo "::notice title=Tools::$(java -version 2>&1 | head -1), build tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Add Firebase settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci-run.sh "Firebase settings" node native/scripts/firebase-config.mjs

      # The reference results must come from src/app.js (the earlier web app), so the engine is tested against it
      - name: Check the reference results
        run: bash scripts/ci-run.sh "Reference results" node native/scripts/golden/make.mjs --check

      - name: Test the sleep engine
        working-directory: native
        run: |
          chmod +x gradlew
          bash ../scripts/ci-run.sh "Engine tests" bash scripts/unit-tests.sh

      - name: Build
        working-directory: native
        run: |
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          bash ../scripts/ci-run.sh "Gradle build" ./gradlew assembleRelease bundleRelease --warning-mode=summary
          bash ../scripts/permissions.sh app/build/outputs/logs/manifest-merger-release-report.txt

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APK_IN: native/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB_IN: native/app/build/outputs/bundle/release/app-release.aab
          OUT_NAME: sleep-tracker
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/gs.json"
          GS_JSON="$RUNNER_TEMP/gs.json" bash scripts/ci-run.sh "Signing" bash scripts/sign.sh
          rm -f "$RUNNER_TEMP/gs.json"

      - uses: actions/upload-artifact@v6
        with:
          name: sleep-tracker-build-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'versionName' native/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION-build.${{ github.run_number }}"
          APK=$(ls dist/*.apk | head -1)
          if ls dist/*.aab >/dev/null 2>&1; then
            NOTES="Install $(basename "$APK") on your phone, or upload $(ls dist/*.aab | head -1 | xargs basename) to Google Play. It updates the earlier version of Sleep Tracker: sign in again afterwards, and your entries come back from your account."
          else
            NOTES="Install $(basename "$APK") on your phone. A test build, signed with the public test key: not for Google Play."
          fi
          bash scripts/ci-run.sh "Release" gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Sleep Tracker $VERSION (build ${{ github.run_number }})" --notes "$NOTES"
          echo "::notice title=Download::https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$APK")"

  # The signed app on Android emulators, used the way a person would (native/scripts/emulator/drive.py):
  # a throwaway account, a month of sleep from a CSV file, every screen, reminders, Health Connect, the tile,
  # shortcuts, then the account is deleted. Screenshots go to the emulator-api-N branches.
  emulator:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            full: "1"
          - api: 28
            full: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Get the app from the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "sleep-tracker-build-$GITHUB_RUN_NUMBER" --dir dist && ls -la dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use the app on Android (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FULL: ${{ matrix.full }}
          API: ${{ matrix.api }}
          ACCOUNTS: ${{ runner.temp }}/test-accounts.txt
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 native/scripts/emulator/drive.py "$(ls dist/*.apk | head -1)" com.resz073.sleeptracker

      - name: Remove any test account left behind
        if: always()
        env:
          ACCOUNTS: ${{ runner.temp }}/test-accounts.txt
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 native/scripts/emulator/cleanup.py

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}-build-${{ github.run_number }}
          path: emulator-results/
          retention-days: 14

      # Screenshots and screen text (not the full log) on a branch, so they can be looked at without downloading
      - name: Keep the screenshots on a branch
        if: always()
        run: |
          [ -d emulator-results ] || exit 0
          mkdir -p "$RUNNER_TEMP/shots" && cp emulator-results/*.png emulator-results/*.md emulator-results/*.csv emulator-results/crash-log.txt emulator-results/0*.txt emulator-results/1*.txt emulator-results/FAILED-*.txt emulator-results/diag-*.txt "$RUNNER_TEMP/shots/" 2>/dev/null || true
          cd "$RUNNER_TEMP/shots"
          git init -q -b results
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Emulator test, API ${{ matrix.api }}, build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results:emulator-api-${{ matrix.api }}
