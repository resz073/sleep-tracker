name: Store screenshots

# The Google Play screenshots, from the newest release on an Android 14 emulator (store/screenshots.py):
# seven weeks of made-up sleep, each tab in light and dark mode. They're kept on the store-raw branch, and
# store/compose.py puts them in frames with captions. Run it from the Actions tab with "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Get the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist && ls -la dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take the screenshots (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: "34"
          ACCOUNTS: ${{ runner.temp }}/test-accounts.txt
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 store/screenshots.py "$(ls dist/*.apk | head -1)"

      - name: Remove any test account left behind
        if: always()
        env:
          ACCOUNTS: ${{ runner.temp }}/test-accounts.txt
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 native/scripts/emulator/cleanup.py

      - name: Keep the screenshots on a branch
        if: always()
        run: |
          [ -d emulator-results ] || exit 0
          mkdir -p "$RUNNER_TEMP/shots" && cp emulator-results/*.png emulator-results/*.md emulator-results/FAILED-*.txt "$RUNNER_TEMP/shots/" 2>/dev/null || true
          cd "$RUNNER_TEMP/shots"
          git init -q -b results
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Store screenshots, run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results:store-raw
